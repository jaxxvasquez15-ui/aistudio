<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Studio">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>AI Studio</title>
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --tint:#7d6bff;--tint2:#9b8cff;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;
  --bar:rgba(22,22,24,.78);--r:12px;--tabh:50px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
@media(prefers-color-scheme:light){:root{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;--bg4:#d1d1d6;--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.1);
  --label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);
  --tint:#5b47f0;--tint2:#7462ff;--bar:rgba(249,249,249,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;height:var(--vvh,100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;font-size:17px}
svg{display:block}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:20px;height:20px}.ic.xs{width:16px;height:16px;stroke-width:2.2}
/* layout */
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#pages{flex:1;position:relative;min-height:0}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:calc(var(--st) + 8px) 16px 24px}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;margin:6px 4px 14px}
/* tab bar */
.tabbar{display:flex;height:calc(var(--tabh) + var(--sb));padding-bottom:var(--sb);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);flex:none;z-index:5}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500}
.tabbar button.on{color:var(--tint)}
body.kb .tabbar{display:none}
/* groups */
.sec-h{font-size:13px;color:var(--label2);text-transform:uppercase;margin:22px 16px 7px;letter-spacing:.2px}
.sec-h:first-child{margin-top:4px}
.sec-f{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.4}
.group{background:var(--bg2);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;gap:12px;position:relative;width:100%;text-align:left}
.row+.row::before,.row+.rowx::before,.rowx+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .k{flex:none}
.row .v{flex:1;text-align:right;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .chev{color:var(--label3);flex:none}
.row input.v{background:none;border:0;outline:none;color:var(--label);text-align:right;padding:11px 0}
.row input.v::placeholder{color:var(--label3)}
.row:active.tap{background:var(--bg3)}
.rowx{padding:12px 16px;position:relative}
.row .lbl{flex:1}
.row.btn-row{justify-content:center;color:var(--tint)}
.row.danger{color:var(--red);justify-content:center}
.ok-dot{width:8px;height:8px;border-radius:4px;background:var(--label3);flex:none}
.ok-dot.ok{background:var(--green)}.ok-dot.bad{background:var(--red)}
/* switch */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:.2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
/* segmented */
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:0;position:relative}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label);white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--bg4);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
@media(prefers-color-scheme:light){.seg button.on{background:#fff}}
.seg button:disabled{opacity:.3}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--fill2);font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--tint);color:#fff}
.chip:disabled{opacity:.3}
.ratio{flex:none;width:58px;height:62px;border-radius:12px;background:var(--fill2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:var(--label2)}
.ratio i{display:block;border:2px solid currentColor;border-radius:3px}
.ratio.on{background:color-mix(in srgb,var(--tint) 20%,transparent);color:var(--tint);box-shadow:inset 0 0 0 1.5px var(--tint)}
/* field */
.opt{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.opt-t{font-size:13px;color:var(--label2);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.prompt-box{background:var(--bg2);border-radius:var(--r);padding:12px 14px 8px}
.prompt-box textarea{width:100%;min-height:110px;background:none;border:0;outline:none;resize:none;line-height:1.45;font-size:17px}
.prompt-box textarea::placeholder{color:var(--label3)}
.pb-bar{display:flex;align-items:center;gap:10px;margin-top:4px}
.pb-bar .cnt{margin-left:auto;font-size:12px;color:var(--label3)}
.mini{height:30px;padding:0 11px;border-radius:15px;background:var(--fill2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;color:var(--label2)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;background:var(--fill2) center/cover;position:relative;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;background:var(--bg4);color:var(--label);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.stepper{display:flex;align-items:center;background:var(--fill2);border-radius:9px;height:32px}
.stepper button{width:44px;height:32px;font-size:20px;color:var(--label)}
.stepper span{min-width:28px;text-align:center;font-weight:600;font-size:15px;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep)}
.stepper button:disabled{opacity:.3}
.cta-wrap{padding:10px 16px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent);flex:none}
.cta{width:100%;height:52px;border-radius:14px;background:var(--tint);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.98);opacity:.85}
.cta:disabled{opacity:.45}
.cta .spin{width:18px;height:18px;border:2.2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.model-pill{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--r);padding:0 14px;height:52px;width:100%;margin-top:10px}
.model-pill .mi{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--tint),#36c3ff);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.model-pill .mn{flex:1;text-align:left;min-width:0}
.model-pill .mn b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-pill .mn small{display:block;font-size:12px;color:var(--label2)}
.more-t{display:flex;align-items:center;gap:6px;color:var(--tint);font-size:15px;margin:16px 4px 0}
.more-t svg{transition:transform .2s}.more-t.open svg{transform:rotate(90deg)}
/* results */
.res-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}
.res-h b{font-size:20px;font-weight:700}.res-h button{color:var(--tint);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:var(--r);overflow:hidden}
.grid.g2{grid-template-columns:repeat(2,1fr);gap:8px;border-radius:0;overflow:visible}
.cell{aspect-ratio:1;background:var(--bg2) center/cover;position:relative;overflow:hidden}
.grid.g2 .cell{border-radius:12px}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.cell .badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;display:flex;align-items:center;gap:3px;-webkit-backdrop-filter:blur(8px)}
.job{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.job .jt{flex:1;min-width:0}
.job .jt b{display:block;font-size:15px;font-weight:600}
.job .jt p{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.job .jt .err{white-space:normal;color:var(--red)}
.ring{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--tint);animation:sp 1s linear infinite}
.job.fail .ring{animation:none;border-color:var(--red);display:flex;align-items:center;justify-content:center;color:var(--red)}
.indet{height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:8px;position:relative}
.indet i{position:absolute;top:0;bottom:0;width:35%;background:var(--tint);border-radius:2px;animation:ind 1.4s ease-in-out infinite}
@keyframes ind{0%{left:-35%}100%{left:100%}}
.empty{text-align:center;color:var(--label2);padding:70px 20px;font-size:15px;line-height:1.6}
.empty .ei{width:64px;height:64px;margin:0 auto 14px;color:var(--label3)}
.empty .ei svg{width:64px;height:64px;stroke-width:1.2}
/* chat */
.cnav{flex:none;padding:calc(var(--st) + 2px) 8px 6px;display:flex;align-items:center;gap:4px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);z-index:3}
.nbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:22px;flex:none}
.ntitle{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.ntitle b{font-size:17px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntitle span{font-size:12px;color:var(--label2);display:flex;align-items:center;gap:2px;max-width:100%}
.ntitle span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{padding:14px 16px 10px}
.m{margin:0 0 18px;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.m.user{display:flex;flex-direction:column;align-items:flex-end}
.m.user .bub{background:var(--tint);color:#fff;padding:9px 14px;border-radius:20px;border-bottom-right-radius:6px;max-width:82%;white-space:pre-wrap;word-break:break-word;font-size:17px}
.m.user .imgs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:6px;max-width:82%}
.m.user .imgs img{width:120px;height:120px;object-fit:cover;border-radius:14px}
.m.ai .body{font-size:17px;line-height:1.55;word-break:break-word}
.body p{margin:0 0 .7em}.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3,.body h4{font-size:1.08em;font-weight:700;margin:1em 0 .45em}
.body ul,.body ol{padding-left:1.4em;margin:0 0 .7em}.body li{margin:.2em 0}
.body blockquote{border-left:3px solid var(--fill);padding-left:10px;color:var(--label2);margin:0 0 .7em}
.body a{color:var(--tint)}
.body code{font:14px ui-monospace,"SF Mono",Menlo,monospace;background:var(--fill2);padding:1px 5px;border-radius:5px}
.body hr{border:0;border-top:.5px solid var(--sep);margin:1em 0}
.cb{background:var(--bg2);border-radius:12px;margin:0 0 .8em;overflow:hidden}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:var(--label2);background:var(--fill2)}
.cb-h button{font-size:12px;color:var(--label2);display:flex;gap:4px;align-items:center}
.cb pre{padding:10px 12px;overflow-x:auto;margin:0}
.cb pre code{background:none;padding:0;font-size:13px;line-height:1.5;white-space:pre}
.tbl{overflow-x:auto;margin:0 0 .8em}.tbl table{border-collapse:collapse;font-size:14px}.tbl td,.tbl th{border:.5px solid var(--sep);padding:5px 9px;text-align:left}
.think{margin:0 0 10px;border-left:2px solid var(--fill);padding-left:10px}
.think summary{list-style:none;font-size:14px;color:var(--label2);display:flex;align-items:center;gap:4px;padding:2px 0;cursor:pointer}
.think summary::-webkit-details-marker{display:none}
.think[open] summary svg{transform:rotate(90deg)}
.think .tb{font-size:14px;color:var(--label2);line-height:1.5;white-space:pre-wrap;margin-top:4px;max-height:280px;overflow-y:auto}
.macts{display:flex;gap:2px;margin-top:6px;margin-left:-8px}
.macts button{width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--label2);border-radius:8px}
.macts button:active{background:var(--fill2)}
.m.err .body{color:var(--red);font-size:15px}
.cursor::after{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--label);margin-left:4px;animation:bl 1s infinite;vertical-align:middle}
@keyframes bl{50%{opacity:.2}}
.sugg{display:grid;gap:8px;margin-top:22px}
.sugg button{background:var(--bg2);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px}
.sugg button small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
.composer{flex:none;padding:8px 10px calc(8px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
body.kb .composer{padding-bottom:8px}
.cin{display:flex;align-items:flex-end;gap:8px}
.cin .attach{width:36px;height:36px;border-radius:18px;background:var(--fill2);display:flex;align-items:center;justify-content:center;color:var(--label2);flex:none;margin-bottom:2px}
.cin .field{flex:1;background:var(--bg2);border:.5px solid var(--sep);border-radius:20px;display:flex;align-items:flex-end;padding:3px 3px 3px 14px;min-width:0}
.cin textarea{flex:1;background:none;border:0;outline:none;resize:none;max-height:150px;padding:7px 0;line-height:1.3;min-width:0}
.cin textarea::placeholder{color:var(--label3)}
.send{width:32px;height:32px;border-radius:16px;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.send:disabled{background:var(--fill);color:var(--label3)}
.send .ic{stroke-width:2.6}
.cthumbs{display:flex;gap:8px;padding:2px 2px 8px 46px;overflow-x:auto}
.cthumbs .thumb{width:56px;height:56px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .25s}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg2);border-radius:14px 14px 0 0;max-height:calc(100% - var(--st) - 30px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--sb)}
@media(prefers-color-scheme:light){.sheet{background:#f2f2f7}.sheet .group,.sheet .search{background:#fff}}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sh-h{display:flex;align-items:center;padding:8px 8px 8px 16px;flex:none}
.sh-h b{flex:1;font-size:17px;font-weight:600;text-align:center;margin-left:52px}
.sh-h button{width:52px;color:var(--tint);font-weight:600;height:36px}
.sh-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.search{display:flex;align-items:center;gap:6px;background:var(--fill2);border-radius:10px;padding:0 8px;height:36px;margin-bottom:12px;color:var(--label2)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--label);min-width:0}
.check{color:var(--tint)}
.mrow .lbl small{display:block;font-size:12px;color:var(--label2);margin-top:1px}
.mrow .lbl{padding:9px 0}
.as{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:21;transform:translateY(130%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.as.on{transform:none}
.as .g{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as .t{font-size:13px;color:var(--label2);text-align:center;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.as button{display:block;width:100%;height:56px;font-size:19px;color:var(--tint);border-top:.5px solid var(--sep)}
.as .g button:first-child{border-top:0}.as .t+button{border-top:0}
.as button.d{color:var(--red)}.as button.c{font-weight:600;background:var(--bg2);border-radius:14px;border:0}
.toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-150%);background:var(--bg3);color:var(--label);padding:10px 16px;border-radius:22px;font-size:15px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:90%;display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
/* viewer */
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;opacity:0;transition:opacity .2s;pointer-events:none;color:#fff}
.viewer.on{opacity:1;pointer-events:auto}
.v-top{display:flex;justify-content:space-between;padding:calc(var(--st) + 4px) 8px 4px}
.v-top button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff}
.v-media{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 0}
.v-media img,.v-media video{max-width:100%;max-height:100%;object-fit:contain}
.v-info{padding:12px 16px 0;font-size:14px;color:rgba(255,255,255,.85);max-height:22vh;overflow-y:auto}
.v-info small{display:block;color:rgba(255,255,255,.5);margin-top:6px;font-size:12px}
.v-acts{display:flex;justify-content:space-around;padding:10px 8px calc(var(--sb) + 8px)}
.v-acts button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#fff;min-width:60px}
.v-acts button.d{color:#ff6961}
textarea.big{width:100%;min-height:200px;background:var(--bg2);border-radius:12px;padding:12px;border:0;outline:none;resize:none;line-height:1.45}
.conv-row .lbl b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-row .lbl small{color:var(--label2);font-size:12px}
.conv-row .lbl{padding:9px 0;min-width:0}
.conv-row.cur{background:color-mix(in srgb,var(--tint) 14%,transparent)}
.del{color:var(--label3);width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
.field-in{width:100%;background:var(--bg2);border:0;border-radius:10px;padding:11px 12px;outline:none}

</style>
</head>
<body>
<div id="app">
<main id="pages">

<!-- ========== 对话 ========== -->
<section class="page on" id="p-chat">
  <header class="cnav">
    <button class="nbtn" id="convBtn" aria-label="会话列表"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ntitle" id="chatTitleBtn"><b id="chatTitle">新对话</b><span><em id="chatModelName">选择模型</em><svg class="ic xs" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button>
    <button class="nbtn" id="newChat" aria-label="新对话"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  </header>
  <div class="scroll" id="chatScroll"><div id="msgs"></div></div>
  <div class="composer">
    <div class="cthumbs" id="chatThumbs" style="display:none"></div>
    <div class="cin">
      <button class="attach" id="chatAttach" aria-label="添加图片"><svg class="ic s" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="field"><textarea id="chatIn" rows="1" placeholder="发消息"></textarea>
        <button class="send" id="chatSend" disabled aria-label="发送"><svg class="ic s" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    </div>
  </div>
</section>

<!-- ========== 生图 ========== -->
<section class="page" id="p-image">
  <div class="scroll"><div class="pad">
    <h1 class="lt">生图</h1>
    <div class="prompt-box">
      <textarea id="imgPrompt" placeholder="描述你想要的画面，例如：清晨薄雾中的江南古镇，水墨风格"></textarea>
      <div class="thumbs" id="imgRefs" style="display:none"></div>
      <div class="pb-bar">
        <button class="mini" id="imgAddRef"><svg class="ic xs" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>参考图</button>
        <button class="mini" id="imgClear">清空</button>
        <span class="cnt" id="imgCnt">0</span>
      </div>
    </div>
    <button class="model-pill" data-model="image"><span class="mi"><svg class="ic s" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg></span><span class="mn"><b>选择模型</b><small>图片模型</small></span><svg class="ic s chev" viewBox="0 0 24 24" style="color:var(--label3)"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="opt"><div class="opt-t">画面比例</div><div class="chips" id="imgRatios"></div></div>
    <div class="opt"><div class="opt-t">清晰度</div><div class="seg" id="imgRes"></div></div>
    <div class="opt" style="display:flex;align-items:center;justify-content:space-between"><div class="opt-t" style="margin:0">生成数量</div><div class="stepper" id="imgN"><button data-d="-1">−</button><span>1</span><button data-d="1">+</button></div></div>
    <button class="more-t" id="imgMoreT"><svg class="ic xs" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>更多选项</button>
    <div id="imgMore" style="display:none">
      <div class="opt"><div class="opt-t">画质</div><div class="seg" id="imgQuality"></div></div>
      <div class="group" style="margin-top:10px">
        <div class="row"><span class="lbl">后台任务模式<small style="display:block;font-size:12px;color:var(--label2)">高清或排队慢时更稳定</small></span><label class="sw"><input type="checkbox" id="imgAsync"><i></i></label></div>
        <div class="row"><span class="k">随机种子</span><input class="v" id="imgSeed" inputmode="numeric" placeholder="随机"></div>
      </div>
    </div>
    <div class="res-h"><b>最近生成</b><button data-goto="gallery">全部</button></div>
    <div class="grid" id="imgRecent"></div>
  </div></div>
  <div class="cta-wrap"><button class="cta" id="imgGo">生成图片</button></div>
</section>

<!-- ========== 生视频 ========== -->
<section class="page" id="p-video">
  <div class="scroll"><div class="pad">
    <h1 class="lt">生视频</h1>
    <div class="prompt-box">
      <textarea id="vidPrompt" placeholder="描述画面、动作和镜头，例如：女孩回头微笑，镜头缓缓推近，微风吹动发丝"></textarea>
      <div class="pb-bar"><button class="mini" id="vidClear">清空</button><span class="cnt" id="vidCnt">0</span></div>
    </div>
    <button class="model-pill" data-model="video"><span class="mi"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg></span><span class="mn"><b>选择模型</b><small>视频模型</small></span><svg class="ic s chev" viewBox="0 0 24 24" style="color:var(--label3)"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="opt" id="vidFramesOpt"><div class="opt-t"><span>首尾帧（可选，图生视频）</span></div><div class="thumbs" id="vidFrames" style="padding-top:0"></div></div>
    <div class="opt"><div class="opt-t">画面比例</div><div class="chips" id="vidRatios"></div></div>
    <div class="opt"><div class="opt-t">分辨率</div><div class="seg" id="vidRes"></div></div>
    <div class="opt"><div class="opt-t">时长</div><div class="seg" id="vidDur"></div></div>
    <div class="group" style="margin-top:10px" id="vidAudioG"><div class="row"><span class="lbl">生成音频</span><label class="sw"><input type="checkbox" id="vidAudio" checked><i></i></label></div></div>
    <button class="more-t" id="vidMoreT"><svg class="ic xs" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>更多选项</button>
    <div id="vidMore" style="display:none">
      <div class="opt"><div class="opt-t">超分辨率（生成后增强）</div><div class="seg" id="vidSr"></div></div>
      <div class="group" style="margin-top:10px"><div class="row"><span class="k">随机种子</span><input class="v" id="vidSeed" inputmode="numeric" placeholder="随机"></div></div>
    </div>
    <div id="vidCaps" class="sec-f" style="margin:10px 4px 0"></div>
    <div class="res-h" id="jobsH" style="display:none"><b>进行中</b></div>
    <div id="vidJobs"></div>
    <div class="res-h"><b>最近生成</b><button data-goto="gallery">全部</button></div>
    <div class="grid g2" id="vidRecent"></div>
  </div></div>
  <div class="cta-wrap"><button class="cta" id="vidGo">生成视频</button></div>
</section>

<!-- ========== 作品 ========== -->
<section class="page" id="p-gallery">
  <div class="scroll"><div class="pad">
    <h1 class="lt">作品</h1>
    <div class="seg" id="galSeg" style="margin-bottom:14px"><button data-v="all" class="on">全部</button><button data-v="image">图片</button><button data-v="video">视频</button></div>
    <div class="grid" id="gal"></div>
  </div></div>
</section>

<!-- ========== 设置 ========== -->
<section class="page" id="p-set">
  <div class="scroll"><div class="pad">
    <h1 class="lt">设置</h1>
    <div class="sec-h">网关</div>
    <div class="group">
      <div class="rowx"><div class="seg" id="gwSeg"><button data-v="gr">GlobalRouter</button><button data-v="oai">OpenAI 兼容</button></div></div>
      <div class="row"><span class="k">地址</span><input class="v" data-cfg="base" placeholder="https://…" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
      <div class="row"><span class="k">API Key</span><input class="v" data-cfg="key" id="keyIn" type="password" placeholder="sk-…" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="keyEye" style="color:var(--label3)"><svg class="ic s" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button class="row tap" id="testBtn"><span class="ok-dot" id="testDot"></span><span class="lbl">测试连接</span><span class="v" id="testInfo">未连接</span></button>
    </div>
    <div class="sec-f">Key 只保存在这台手机上，只发送给上面的地址。</div>

    <div class="sec-h">默认模型</div>
    <div class="group">
      <button class="row tap" data-model="chat"><span class="k">对话</span><span class="v" data-mv="chat">未选择</span><svg class="ic s chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="row tap" data-model="image"><span class="k">图片</span><span class="v" data-mv="image">未选择</span><svg class="ic s chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="row tap" data-model="video"><span class="k">视频</span><span class="v" data-mv="video">未选择</span><svg class="ic s chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>

    <div class="sec-h">对话</div>
    <div class="group">
      <button class="row tap" id="sysBtn"><span class="k">系统提示词</span><span class="v" id="sysV">无</span><svg class="ic s chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="row"><span class="lbl">显示思考过程</span><label class="sw"><input type="checkbox" data-cfgb="showThink"><i></i></label></div>
      <div class="row"><span class="lbl">流式输出</span><label class="sw"><input type="checkbox" data-cfgb="stream"><i></i></label></div>
    </div>

    <div class="sec-h">高级</div>
    <div class="group">
      <button class="row tap" id="advBtn"><span class="k">接口路径与额外参数</span><span class="v"></span><svg class="ic s chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>

    <div class="sec-h">数据</div>
    <div class="group">
      <div class="row"><span class="k">已用空间</span><span class="v" id="storeInfo">—</span></div>
      <button class="row danger" id="clrChats">删除所有对话</button>
      <button class="row danger" id="clrWorks">删除所有作品</button>
    </div>
    <div class="sec-f" style="text-align:center;margin-top:24px">AI Studio v5</div>
  </div></div>
</section>
</main>

<nav class="tabbar">
  <button data-t="chat" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12Z"/></svg>对话</button>
  <button data-t="image"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>生图</button>
  <button data-t="video"><svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="5" width="14" height="14" rx="3"/><path d="m16.5 10 5-3v10l-5-3"/></svg>生视频</button>
  <button data-t="gallery"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>作品</button>
  <button data-t="set"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>设置</button>
</nav>
</div>
<input type="file" id="filePick" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer">
  <div class="v-top"><button id="vClose"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><span></span></div>
  <div class="v-media" id="vMedia"></div>
  <div class="v-info" id="vInfo"></div>
  <div class="v-acts" id="vActs"></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const lsJ=(k,d)=>{try{const v=JSON.parse(lsGet(k));return v??d}catch{return d}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const IC={
  copy:'<svg class="ic xs" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  redo:'<svg class="ic xs" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
  share:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  trashS:'<svg class="ic s" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  text:'<svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  again:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
  film:'<svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="5" width="14" height="14" rx="3"/><path d="m16.5 10 5-3v10l-5-3"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="10" height="10" fill="#fff"><path d="M7 4v16l13-8Z"/></svg>',
  chev:'<svg class="ic xs" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  check:'<svg class="ic s" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12.5 10 17 19 7"/></svg>',
  plus:'<svg class="ic s" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  stop:'<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  up:'<svg class="ic s" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  search:'<svg class="ic s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  img:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>',
  chat:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12Z"/></svg>',
  warn:'<svg class="ic s" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  x:'<svg class="ic xs" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};

/* ================= 配置 ================= */
const PRESETS={
  gr:{chatPath:'/api/v1/chat/completions',imagePath:'/api/v1/images',imageTaskPath:'/api/v1/image-tasks',modelsPath:'/api/v1/models',videoModelsPath:'/api/v1/videos/models',videoSubmit:'/api/v1/videos',videoStatus:'/api/v1/videos/{id}',videoContent:'/api/v1/videos/{id}/content'},
  oai:{chatPath:'/v1/chat/completions',imagePath:'/v1/images/generations',imageTaskPath:'',modelsPath:'/v1/models',videoModelsPath:'',videoSubmit:'/v1/videos',videoStatus:'/v1/videos/{id}',videoContent:'/v1/videos/{id}/content'}
};
const DEF={base:'https://api.globalrouter.ai',key:'',gw:'gr',chatModel:'',imageModel:'',videoModel:'',system:'',showThink:true,stream:true,
  ...PRESETS.gr,chatExtra:'',imageExtra:'',videoExtra:''};
let cfg={...DEF,...lsJ('ais.cfg',{})};
if(cfg.videoPreset&&!lsJ('ais.cfg',{}).gw){cfg.gw=cfg.videoPreset==='globalrouter'?'gr':'oai';delete cfg.videoPreset;
  if(cfg.gw==='gr')Object.assign(cfg,PRESETS.gr)}
let models=lsJ('ais.models',[]);              // [{id,name,kind}]
let vinfo=lsJ('ais.vinfo',{});                 // id -> caps
const saveCfg=()=>lsSet('ais.cfg',JSON.stringify(cfg));
saveCfg();

/* ================= 网络 ================= */
function u(p,id){
  let b=(cfg.base||'').trim().replace(/\/+$/,'');
  if(!b)throw new Error('请先到「设置」填写网关地址');
  p=String(p||'').replace('{id}',encodeURIComponent(id||''));
  if(/^https?:\/\//.test(p))return p;
  if(/\/api\/v1$/.test(b)&&p.startsWith('/api/v1'))p=p.slice(7);
  else if(/\/v1$/.test(b)&&p.startsWith('/v1'))p=p.slice(3);
  if(!p.startsWith('/'))p='/'+p;
  return b+p;
}
const baseOrigin=()=>{try{return new URL(u('/')).origin}catch{return''}};
const H=json=>{const h={};if(cfg.key)h.Authorization='Bearer '+cfg.key.trim();if(json)h['Content-Type']='application/json';return h};
async function f(url,opt){
  if(!cfg.key)throw new Error('请先到「设置」填写 API Key');
  try{return await fetch(url,opt)}
  catch(e){if(e.name==='AbortError')throw e;
    throw new Error('网络请求失败：'+e.message+'。请检查网络、网关地址，或转发服务是否正常。')}
}
async function apiErr(r){
  let t=await r.text().catch(()=>'');
  try{const j=JSON.parse(t);t=j.error?.message||j.message||j.detail||(typeof j.error==='string'?j.error:t)}catch{}
  const hint=r.status===401?'（Key 无效或已过期）':r.status===403?'（Key 权限不足）':r.status===429?'（请求太频繁或额度不足）':r.status===402?'（余额不足）':'';
  return new Error('错误 '+r.status+hint+'：'+String(t||r.statusText).slice(0,400));
}
async function jpost(path,body,signal){
  const r=await f(u(path),{method:'POST',headers:H(true),body:JSON.stringify(body),signal});
  if(!r.ok)throw await apiErr(r);return r.json();
}
async function jget(path,id){const r=await f(u(path,id),{headers:H(false)});if(!r.ok)throw await apiErr(r);return r.json()}
function parseExtra(s,name){
  s=(s||'').trim();if(!s)return{};
  try{const o=JSON.parse(s);if(o&&typeof o==='object'&&!Array.isArray(o))return o}catch{}
  throw new Error(name+'额外参数不是合法的 JSON 对象，请到「设置 → 高级」修改');
}
const pick=(o,path)=>{let c=o;for(const k of path.split(/[.\[\]]+/).filter(Boolean)){if(c==null)return;c=c[k]}return c};
const pickAny=(o,ps)=>{for(const p of ps){const v=pick(o,p);if(v!==undefined&&v!==null&&v!=='')return v}};
// 下载媒体：直连 → 网关鉴权 → 转发服务
async function fetchBlob(url){
  const same=(()=>{try{return new URL(url).origin===baseOrigin()}catch{return false}})();
  try{const r=await fetch(url,same?{headers:H(false)}:{});if(r.ok)return await r.blob()}catch{}
  if(!/globalrouter\./.test(cfg.base)&&!same){
    try{const r=await fetch(u('/__fetch')+'?url='+encodeURIComponent(url));if(r.ok)return await r.blob()}catch{}
  }
  return null;
}

/* ================= 存储 ================= */
let _db;
function db(){return _db||(_db=new Promise((res,rej)=>{
  const q=indexedDB.open('aistudio',2);
  q.onupgradeneeded=()=>{const d=q.result;

/* ================= Markdown ================= */
function inl(s){
  return esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src){
  const out=[];const parts=String(src||'').split(/```/);
  parts.forEach((p,i)=>{
    if(i%2){const m=p.match(/^([\w+#.-]*)\n?/);const lang=m?m[1]:'';const code=p.slice(m?m[0].length:0).replace(/\n$/,'');
      out.push(`<div class="cb"><div class="cb-h"><span>${esc(lang||'code')}</span><button data-copy>${IC.copy}复制</button></div><pre><code>${esc(code)}</code></pre></div>`);return}
    const lines=p.split('\n');let buf=[],list=null,tbl=[];
    const flush=()=>{if(buf.length){out.push('<p>'+buf.map(inl).join('<br>')+'</p>');buf=[]}};
    const flushL=()=>{if(list){out.push(`<${list.t}>${list.items.map(x=>'<li>'+inl(x)+'</li>').join('')}</${list.t}>`);list=null}};
    const flushT=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,'').split('|'));
      out.push('<div class="tbl"><table>'+rows.map((r,ri)=>'<tr>'+r.map(c=>`<${ri?'td':'th'}>${inl(c.trim())}</${ri?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>');tbl=[]}};
    for(const l of lines){
      let m;
      if(/^\s*\|.*\|\s*$/.test(l)){flush();flushL();tbl.push(l);continue}else flushT();
      if(!l.trim()){flush();flushL();continue}
      if(m=l.match(/^(#{1,6})\s+(.*)/)){flush();flushL();out.push(`<h${Math.min(4,m[1].length+1)}>${inl(m[2])}</h${Math.min(4,m[1].length+1)}>`);continue}
      if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){flush();flushL();out.push('<hr>');continue}
      if(m=l.match(/^\s*>\s?(.*)/)){flush();flushL();out.push('<blockquote>'+inl(m[1])+'</blockquote>');continue}
      if(m=l.match(/^\s*[-*•]\s+(.*)/)){flush();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]}}list.items.push(m[1]);continue}
      if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flush();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]}}list.items.push(m[1]);continue}
      if(list){list.items[list.items.length-1]+=' '+l.trim();continue}
      buf.push(l);
    }
    flush();flushL();flushT();
  });
  return out.join('');
}

    try{r=await go(stream)}catch(e){if(e.name==='AbortError'||!stream)throw e;r=await go(false)}
    if(!r.ok)throw await apiErr(r);
    if((r.headers.get('content-type')||'').includes('event-stream')&&r.body){
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='',n=0;
      for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith('data:'))continue;const data=line.slice(5).trim();if(!data||data==='[DONE]')continue;
          try{const j=JSON.parse(data);if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
            const d=j.choices?.[0]?.delta||{};const rc=d.reasoning_content||d.reasoning||'';
            if(rc){ai.reasoning+=rc}if(d.content){ai.content+=d.content}
            if(rc||d.content){renderLast();if(++n%40===0)saveConv()}
          }catch(e){if(e.message&&!/JSON/.test(e.message)&&!(e instanceof SyntaxError))throw e}
        }}
    }else{
      const j=await r.json();const m=j.choices?.[0]?.message||{};
      ai.content=m.content||'';ai.reasoning=m.reasoning_content||m.reasoning||'';
      if(!ai.content&&!ai.reasoning)ai.content=JSON.stringify(j).slice(0,800);
    }
    if(!ai.content&&!ai.reasoning)ai.content='（模型没有返回内容）';
  }catch(e){
    if(e.name==='AbortError'){if(!ai.content)ai.content='（已停止）'}
    else{if(!curConv.messages.includes(ai))curConv.messages.push(ai);if(ai.content){ai.content+='\n\n> ⚠️ '+e.message}else ai.error=e.message}
  }finally{
    ai.streaming=false;ctl=null;updSend();renderChat();saveConv();
  }
}

  job.status='downloading';saveJobs();renderJobs();
  let url=findUrl(res),blob=null;
  if(url)blob=await fetchBlob(url);
  if(!blob&&cfg.videoContent){try{const r=await f(u(cfg.videoContent,job.id),{headers:H(false)});if(r.ok)blob=await r.blob()}catch{}}
  if(!blob&&!url)throw new Error('任务完成，但没有找到视频地址');
  if(blob&&!/^video\//.test(blob.type))blob=new Blob([blob],{type:'video/mp4'});
  const it={id:uid(),type:'video',prompt:job.prompt,model:job.model,ts:Date.now(),params:job.params,url:url||undefined,blob:blob||undefined};
  await saveItem(it);jobs=jobs.filter(x=>x!==job);saveJobs();
  toast('视频已生成');if(curTab==='video')renderRecentVideos();else renderJobs();
}
async function poll(job){
  if(polling.has(job.id))return;polling.add(job.id);let errs=0;
  try{for(;;){
    await sleep(job.status==='downloading'?100:5000);if(!jobs.includes(job))return;
    try{const j=await jget(cfg.videoStatus,job.id);errs=0;
      const st=String(pickAny(j,['status','state','data.status','task_status'])||'').toLowerCase();
      if(st)job.status=st;saveJobs();
      if(FAIL.includes(st))throw Object.assign(new Error(String(pickAny(j,['error.message','error','message','fail_reason'])||'生成失败（'+st+'）')),{fatal:true});
      if(DONE.includes(st)||(!st&&findUrl(j))){await finishVideo(job,j);return}
    }catch(e){if(e.fatal||++errs>=6)throw e}
    if(Date.now()-job.ts>60*60e3)throw new Error('等待超过 60 分钟，已停止跟踪');
  }}catch(e){job.failed=true;job.error=e.message;saveJobs();renderJobs()}
  finally{polling.delete(job.id)}
}
function sizeForVideo(ratio,res){const h={'480p':480,'720p':720,'1080p':1080}[res]||720;const[a,b]=(ratio.match(/^\d+:\d+$/)?ratio:'16:9').split(':').map(Number);
  const short=h,long=Math.round(h*Math.max(a,b)/Math.min(a,b)/16)*16;return a>=b?`${long}x${short}`:`${short}x${long}`}
$('#vidGo').onclick=async()=>{
  const b=$('#vidGo');const prompt=$('#vidPrompt').value.trim();
  try{
    if(!prompt)throw new Error('请先填写视频描述');
    if(!cfg.videoModel){openModelPicker('video');throw new Error('请先选择视频模型')}
    const extra=parseExtra(cfg.videoExtra,'视频');const c=caps();
    setBusy(b,true,'提交中');
    const params={aspect_ratio:vst.ratio,resolution:vst.res,duration:vst.dur};
    let j;
    if(cfg.gw==='gr'){
      const body={model:cfg.videoModel,prompt,duration:+vst.dur,resolution:vst.res,aspect_ratio:vst.ratio};
      if(c.au)body.generate_audio=!!vst.audio;
      const fr=[];if(vst.first&&c.fr.includes('first_frame'))fr.push({type:'image_url',image_url:{url:vst.first},frame_type:'first_frame'});
      if(vst.last&&c.fr.includes('last_frame'))fr.push({type:'image_url',image_url:{url:vst.last},frame_type:'last_frame'});
      if(fr.length)body.frame_images=fr;
      if(vst.sr)body.sr={resolution:vst.sr};if(vst.seed)body.seed=+vst.seed;
      j=await jpost(cfg.videoSubmit,{...body,...extra});
    }else{
      const fd=new FormData();fd.append('model',cfg.videoModel);fd.append('prompt',prompt);fd.append('seconds',String(vst.dur));fd.append('size',sizeForVideo(vst.ratio,vst.res));
      if(vst.first&&/^data:/.test(vst.first)){const bl=await (await fetch(vst.first)).blob();fd.append('input_reference',bl,'frame.jpg')}
      for(const k in extra)fd.append(k,typeof extra[k]==='object'?JSON.stringify(extra[k]):extra[k]);
      const r=await f(u(cfg.videoSubmit),{method:'POST',headers:H(false),body:fd});if(!r.ok)throw await apiErr(r);j=await r.json();
    }
    const id=pickAny(j,['id','task_id','data.id','data.task_id','request_id','video_id']);
    const job={id:String(id||uid()),prompt,model:cfg.videoModel,ts:Date.now(),status:String(pickAny(j,['status','data.status'])||'pending').toLowerCase(),params};
    jobs.unshift(job);saveJobs();renderJobs();
    if(!id){if(findUrl(j)){await finishVideo(job,j);return}throw new Error('没有拿到任务 ID：'+JSON.stringify(j).slice(0,200))}
    toast('已提交，生成通常需要 1–5 分钟');
    $('#vidJobs').scrollIntoView({behavior:'smooth',block:'center'});
    if(DONE.includes(job.status)&&findUrl(j))await finishVideo(job,j);else poll(job);
  }catch(e){toast(e.message,4500)}
  finally{setBusy(b,false)}
};

/* ================= 设置 ================= */
function renderSettings(){
  $$('[data-cfg]').forEach(el=>{if(document.activeElement!==el)el.value=cfg[el.dataset.cfg]??''});
  $$('[data-cfgb]').forEach(el=>el.checked=cfg[el.dataset.cfgb]!==false);
  $$('#gwSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.gw));
  $('#sysV').textContent=cfg.system.trim()?cfg.system.trim().slice(0,20):'无';
  refreshModelLabels();
  if(models.length&&$('#testInfo').textContent==='未连接'){$('#testInfo').textContent=models.length+' 个模型'}
  if(navigator.storage?.estimate)navigator.storage.estimate().then(e=>{$('#storeInfo').textContent=(e.usage/1048576).toFixed(1)+' MB'}).catch(()=>{});
}
$$('[data-cfg]').forEach(el=>el.addEventListener('input',()=>{cfg[el.dataset.cfg]=el.value.trim();saveCfg()}));
$$('[data-cfgb]').forEach(el=>el.addEventListener('change',()=>{cfg[el.dataset.cfgb]=el.checked;saveCfg();if(el.dataset.cfgb==='showThink')renderChat()}));
$$('#gwSeg button').forEach(b=>b.onclick=()=>{cfg.gw=b.dataset.v;Object.assign(cfg,PRESETS[cfg.gw]);saveCfg();renderSettings();renderVideoOpts();toast('已切换为'+b.textContent+'接口')});
$('#keyEye').onclick=()=>{const k=$('#keyIn');k.type=k.type==='password'?'text':'password'};
$('#testBtn').onclick=async()=>{
  const d=$('#testDot'),i=$('#testInfo');d.className='ok-dot';i.textContent='连接中…';
  try{const ms=await loadModels();d.className='ok-dot ok';
    const c={chat:0,image:0,video:0};ms.forEach(m=>c[m.kind]++);
    i.textContent=`已连接 · ${ms.length} 个模型`;toast(`对话 ${c.chat} · 图片 ${c.image} · 视频 ${c.video}`);}
  catch(e){d.className='ok-dot bad';i.textContent='失败';toast(e.message,5000)}
};
$('#sysBtn').onclick=async()=>{const v=await textPrompt('系统提示词',cfg.system,'例如：你是一名专业的视频分镜师，回答简洁',true);if(v!==null){cfg.system=v;saveCfg();renderSettings()}};
$('#advBtn').onclick=()=>{
  const fields=[['chatPath','对话'],['imagePath','生图'],['imageTaskPath','生图任务'],['modelsPath','模型列表'],['videoModelsPath','视频模型列表'],['videoSubmit','视频提交'],['videoStatus','视频查询（{id}）'],['videoContent','视频下载（{id}）']];
  const body=document.createElement('div');
  body.innerHTML=`<div class="sec-h" style="margin-top:4px">接口路径</div><div class="group">${fields.map(([k,l])=>`<div class="row"><span class="k" style="font-size:15px">${l}</span><input class="v mono" data-adv="${k}" value="${esc(cfg[k]||'')}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>`).join('')}</div>
   <button class="row btn-row group" style="margin-top:10px" id="advReset">恢复默认路径</button>
   ${[['chatExtra','对话额外参数','{"temperature":0.7}'],['imageExtra','生图额外参数','{"provider":{"provider_id":"doubao"}}'],['videoExtra','视频额外参数','{"provider":"byteplus"}']].map(([k,l,ph])=>`<div class="sec-h">${l}（JSON）</div><textarea class="big mono" style="min-height:70px" data-adv="${k}" placeholder='${ph}' autocapitalize="off" spellcheck="false">${esc(cfg[k]||'')}</textarea>`).join('')}
   <div class="sec-f">额外参数会合并进请求体，用于指定 provider 等高级选项。</div>`;
  body.querySelector('#advReset').onclick=()=>{Object.assign(cfg,PRESETS[cfg.gw]);saveCfg();body.querySelectorAll('[data-adv]').forEach(el=>{if(PRESETS[cfg.gw][el.dataset.adv]!==undefined)el.value=cfg[el.dataset.adv]});toast('已恢复')};
  sheet({title:'高级设置',body,done:()=>{
    for(const el of body.querySelectorAll('[data-adv]')){const k=el.dataset.adv,v=el.value.trim();
      if(/Extra$/.test(k)&&v){try{const o=JSON.parse(v);if(!o||typeof o!=='object'||Array.isArray(o))throw 0}catch{toast('「'+k+'」不是合法的 JSON 对象');return false}}
      cfg[k]=v}
    saveCfg();toast('已保存')}});
};
$('#clrChats').onclick=async()=>{if(await actionSheet('将删除所有对话记录',[{label:'删除所有对话',danger:1}])!==null){await clr('convs');newConv();toast('已删除')}};
$('#clrWorks').onclick=async()=>{if(await actionSheet('将删除所有图片和视频，无法恢复',[{label:'删除所有作品',danger:1}])!==null){await clr('items');toast('已删除');renderSettings()}};

/* ================= 启动 ================= */
renderImgOpts();renderVideoOpts();refreshModelLabels();updCnt();
(async()=>{convs=await all('convs');curConv=convs[0]&&Date.now()-convs[0].ts<6*3600e3?convs[0]:null;if(!curConv)newConv();else renderChat()})();
jobs.filter(j=>!j.failed).forEach(poll);
if(!cfg.key)show('set');
if(cfg.key&&!models.length)loadModels().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)jobs.filter(j=>!j.failed).forEach(poll)});
})();
</script>
